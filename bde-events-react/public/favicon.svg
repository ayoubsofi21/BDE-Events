<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">BDE Events Logo</title>
  <desc id="desc">Modern campus event ticket logo for BDE Events</desc>

  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(55 55)" filter="url(#shadow)">
    <!-- dynamic arc -->
    <path d="M20 265 C105 185 150 125 245 80"
          fill="none" stroke="#0F172A" stroke-width="18" stroke-linecap="round"/>
    <path d="M38 290 C125 225 175 155 270 110"
          fill="none" stroke="#2563EB" stroke-width="7" stroke-linecap="round"/>

    <!-- ticket -->
    <g transform="rotate(-10 150 185)">
      <rect x="72" y="65" width="175" height="245" rx="24" fill="#0F172A"/>
      <rect x="91" y="87" width="137" height="202" rx="18" fill="url(#blue)"/>

      <!-- ticket perforation -->
      <circle cx="105" cy="68" r="7" fill="white"/>
      <circle cx="128" cy="68" r="7" fill="white"/>
      <circle cx="151" cy="68" r="7" fill="white"/>
      <circle cx="174" cy="68" r="7" fill="white"/>
      <circle cx="197" cy="68" r="7" fill="white"/>
      <circle cx="220" cy="68" r="7" fill="white"/>

      <!-- graduation cap -->
      <path d="M112 137 L160 112 L208 137 L160 162 Z" fill="white"/>
      <path d="M128 148 V166 C145 180 175 180 192 166 V148"
            fill="none" stroke="white" stroke-width="7" stroke-linejoin="round"/>
      <path d="M205 138 V165" stroke="white" stroke-width="5" stroke-linecap="round"/>
      <circle cx="205" cy="169" r="4" fill="white"/>

      <!-- lines -->
      <rect x="116" y="193" width="72" height="7" rx="3.5" fill="white"/>
      <rect x="116" y="207" width="55" height="7" rx="3.5" fill="white"/>

      <!-- QR -->
      <g transform="translate(115 230)" fill="white">
        <rect width="25" height="25" rx="2"/>
        <rect x="5" y="5" width="15" height="15" fill="#2563EB"/>
        <rect x="9" y="9" width="7" height="7"/>
        <rect x="38" width="25" height="25" rx="2"/>
        <rect x="43" y="5" width="15" height="15" fill="#2563EB"/>
        <rect x="47" y="9" width="7" height="7"/>
        <rect y="38" width="25" height="25" rx="2"/>
        <rect x="5" y="43" width="15" height="15" fill="#2563EB"/>
        <rect x="9" y="47" width="7" height="7"/>
        <rect x="38" y="38" width="7" height="7"/>
        <rect x="49" y="38" width="7" height="7"/>
        <rect x="56" y="49" width="7" height="7"/>
        <rect x="38" y="56" width="7" height="7"/>
        <rect x="48" y="57" width="5" height="5"/>
      </g>
    </g>

    <!-- confetti -->
    <path d="M55 55 Q85 70 92 110" fill="none" stroke="#FBBF24" stroke-width="18" stroke-linecap="round"/>
    <path d="M120 62 Q128 35 148 18" fill="none" stroke="#2563EB" stroke-width="16" stroke-linecap="round"/>
    <path d="M155 82 Q170 50 195 38" fill="none" stroke="#EC4899" stroke-width="15" stroke-linecap="round"/>
    <circle cx="213" cy="37" r="9" fill="#F97316"/>
    <path d="M224 78 l28 -16 v32z" fill="#FBBF24"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(350 105)">
    <text x="0" y="105"
          font-family="Arial, Helvetica, sans-serif"
          font-size="150"
          font-weight="900"
          letter-spacing="4"
          fill="#0F172A">BDE</text>

    <text x="8" y="205"
          font-family="Arial, Helvetica, sans-serif"
          font-size="82"
          font-weight="700"
          letter-spacing="20"
          fill="#2563EB">EVENTS</text>

    <!-- star -->
    <path d="M575 35 l8 17 19 2-14 12 4 19-17-10-17 10 4-19-14-12 19-2z"
          fill="#FBBF24"/>

    <!-- tagline -->
    <line x1="8" y1="252" x2="155" y2="252" stroke="#94A3B8" stroke-width="3"/>
    <text x="175" y="261"
          font-family="Arial, Helvetica, sans-serif"
          font-size="25"
          font-weight="600"
          letter-spacing="6"
          fill="#475569">CAMPUS TICKETING PLATFORM</text>
    <line x1="710" y1="252" x2="850" y2="252" stroke="#94A3B8" stroke-width="3"/>
  </g>
</svg>
